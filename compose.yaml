# ============================================================
# compose.yaml
#
# PARKED: not used day to day. For now each service runs
# natively and Postgres starts with `make db` (see
# docs/LOCAL_DEV.md). This file comes back once all services
# exist (docs/ROADMAP.md, step 3½).
#
# Runs every service locally from one command.
#
# Each service reads its own env file: services/<name>/.env
# (copy services/<name>/.env.example to get started).
#
# Usage:
#   docker compose up -d          → start in background
#   docker compose down           → stop
#   docker compose logs -f        → tail logs
#   docker compose pull && docker compose up -d  → deploy update
# ============================================================

services:
  api:
    # Build from the service's own folder — each service is self-contained
    build:
      context: ./services/api
      dockerfile: Dockerfile

    # Tag for the built image. On the server, point this at your
    # registry (e.g. ghcr.io/mirajhoque/todo-app:1.2.3) so
    # `docker compose pull` has something to pull.
    image: todo-api:latest

    # Container name — used by Alloy to find logs
    container_name: todo-api

    # Always restart if the container crashes or server reboots
    restart: unless-stopped

    ports:
      - "8080:8080"

    # Load environment variables from .env file
    # Never hardcode secrets in compose.yaml
    env_file:
      - ./services/api/.env

    # `environment` overrides the same key from env_file.
    # Inside the compose network, Postgres is reachable by its
    # service name "postgres" — not "localhost". (localhost inside
    # a container means the container itself.) .env keeps
    # localhost so `make dev` on your laptop still works.
    environment:
      DATABASE_URL: postgres://todo:todo@postgres:5432/todo?sslmode=disable

    # Don't start until Postgres passes its healthcheck — otherwise
    # the app boots first, can't connect, and crashes.
    depends_on:
      postgres:
        condition: service_healthy

    # Logging — use the json-file driver so Docker writes
    # structured logs that Alloy can read
    logging:
      driver: "json-file"
      options:
        max-size: "50m"    # rotate when file hits 50MB
        max-file: "5"      # keep 5 rotated files

    # Health check is defined in the Dockerfile (HEALTHCHECK) —
    # visible in `docker ps` output, no need to repeat it here.

    # Hardening — the app only needs to run one binary and talk
    # to the network, so take everything else away.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

    # Resource limits — one runaway container can't take down the host
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    # Graceful shutdown in main.go waits up to 10s — give it time
    stop_grace_period: 15s

    # Labels — Alloy uses these to find and tag container logs
    labels:
      - "logging=alloy"
      - "service=todo-api"
      - "env=production"

  # ── Postgres ──────────────────────────────────────────────
  # Local development database. On AKS we use Azure Database for
  # PostgreSQL instead — this container is only for your laptop.
  postgres:
    image: postgres:18-alpine
    container_name: todo-postgres
    restart: unless-stopped

    # Local-only credentials — fine to commit because this DB is
    # never reachable from outside your machine.
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo

    # "HOST:CONTAINER" — tools on your laptop (psql, TablePlus,
    # `make dev`) connect at localhost:5433. Host port 5433 because
    # a Postgres installed on the Mac already uses 5432. Containers
    # on the compose network still use postgres:5432.
    ports:
      - "5433:5432"

    # Named volume — data survives `docker compose down`.
    # Wipe it with `docker compose down -v`.
    # (Postgres 18+ expects the mount at /var/lib/postgresql.)
    volumes:
      - pgdata:/var/lib/postgresql

    # pg_isready returns success once Postgres accepts connections.
    # The api's depends_on waits for this.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
